{% extends "base.html" %}
{% block title %}Admin Sign In — ModernCMS{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 3rem auto;">
  <div class="article-container">
    <h2 style="margin-bottom: 1.5rem; text-align: center;">Admin Portal</h2>
    {% if error %}
      <div style="background: #fee2e2; color: #b91c1c; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem;">
        {{ error }}
      </div>
    {% endif %}
    <form action="/admin/login" method="post">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" class="form-control" required autofocus placeholder="admin">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" class="form-control" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn" style="width: 100%;">Sign In</button>
    </form>
    <p style="font-size: 0.8rem; color: var(--text-muted); text-align: center; margin-top: 1rem;">
      Default credentials: <code>admin</code> / <code>admin123</code>
    </p>
  </div>
</div>
{% endblock %}
